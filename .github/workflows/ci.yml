name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which games to test. A game is a top-level folder with scripts/release.sh. Only the games
    # whose files changed run; a change outside every game (workflow, build script, README) or a
    # manual run tests all of them, and so does a push whose base commit is unknown (force push,
    # first commit).
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Storage keys are separate per game (README "Storage")
        run: node scripts/check-storage.mjs
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          all=$(for d in */; do [ -f "$d/scripts/release.sh" ] && echo "${d%/}"; done)
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            picked=""
            outside=0
            for f in $changed; do
              top="${f%%/*}"
              if echo "$all" | grep -qx "$top"; then picked="$picked $top"; else outside=1; fi
            done
            [ "$outside" -eq 1 ] && picked="$all"
          else
            picked="$all"
          fi
          games=$(echo $picked | tr ' ' '\n' | sort -u | grep . | jq -R . | jq -sc .)
          echo "games=$games" >> "$GITHUB_OUTPUT"
          echo "testing: $games"

  test:
    # One runner per changed game: unit tests, then the real game in the runner's Chrome
    # (tests/browser/chrome.js finds /usr/bin/google-chrome on its own).
    name: test ${{ matrix.game }}
    needs: [changes]
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.game }}/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: npm run test:browser
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.game }}
          path: ${{ matrix.game }}/tests/browser/artifacts
          if-no-files-found: ignore

  deploy:
    # Every game is rebuilt and uploaded, not only the changed ones: the selector page lists them
    # all and the sync deletes what is missing from _site/.
    name: deploy
    needs: [changes, test]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      BUCKET: arcade.alzlper.com
      AWS_DEFAULT_REGION: nl-ams
      S3_ENDPOINT: https://s3.nl-ams.scw.cloud
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every game and the selector page into _site/
        run: node scripts/build-site.mjs

      # The games ship plain files without content hashes, so nothing may be cached across a
      # release: an old src/*.js next to a new index.html would break the game. no-cache still
      # lets browsers revalidate with ETags, so unchanged files cost a 304, not a download.
      - name: Upload
        run: |
          aws s3 sync _site "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --cache-control "no-cache, max-age=0, must-revalidate" \
            --delete
      - name: Fix content types the CLI does not know
        run: |
          for f in $(cd _site && find . -name '*.webmanifest' | sed 's#^\./##'); do
            aws s3 cp "_site/$f" "s3://$BUCKET/$f" \
              --endpoint-url "$S3_ENDPOINT" \
              --content-type "application/manifest+json" \
              --cache-control "no-cache, max-age=0, must-revalidate"
          done

      - name: Summary
        run: |
          echo "Deployed $(git rev-parse --short HEAD) to https://$BUCKET/" >> "$GITHUB_STEP_SUMMARY"
          ls _site >> "$GITHUB_STEP_SUMMARY"
