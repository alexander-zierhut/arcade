<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocktail Art Preview</title>
<style>
  body { margin: 0; background: #1b2a33; color: #fff8e1; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 18px; background: #0f1b22; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header small { opacity: .7; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 14px; }
  .cell { background: linear-gradient(#f3d9a4, #d9b574); border-radius: 12px; padding: 8px; text-align: center; color: #3a2a12; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .cell canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
  .cell .name { font-weight: 700; margin-top: 6px; }
  .cell .meta { font-size: 12px; opacity: .8; }
  .pending { opacity: .55; }
  label { user-select: none; }
</style>
</head>
<body>
<header>
  <h1>Cocktail art preview</h1>
  <small>Live view of src/art painters. Reloads automatically when a source file changes. <span id="status"></span></small>
  <button onclick="location.reload()">Reload</button>
  <label>size <input type="range" id="size" min="40" max="160" value="96"></label>
</header>
<div id="grid"></div>

<script src="src/dedication.js"></script>
<script src="src/config.js"></script>
<script src="src/art/glass.js"></script>
<script src="src/art/garnish.js"></script>
<script>
(function () {
  var TIERS = CM.config.TIERS.filter(Boolean);
  var FILES = ['tier1-shot', 'tier2-oldfashioned', 'tier3-cosmo', 'tier4-mojito', 'tier5-margarita',
               'tier6-sunrise', 'tier7-pinacolada', 'tier8-coconut', 'tier9-sangria-verde'];
  var loaded = 0, pending = FILES.length;
  CM.art.tiers = CM.art.tiers || [];

  function done() {
    if (--pending > 0) return;
    draw();
    document.getElementById('status').textContent = loaded + '/9 painters loaded';
  }
  FILES.forEach(function (f) {
    var s = document.createElement('script');
    s.src = 'src/art/' + f + '.js?v=' + Math.floor(Date.now() / 1000);
    s.onload = function () { loaded++; done(); };
    s.onerror = done;
    document.head.appendChild(s);
  });

  function draw() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var R = +document.getElementById('size').value;         // pixels per R-unit
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var G = CM.art.glass, h = { glass: CM.art.glass, garnish: CM.art.garnish };
    TIERS.forEach(function (t) {
      var painter = CM.art.tiers[t.id];
      var box = G.spriteBox(t.id);                          // anchor-space bounds in R-units
      var cw = Math.ceil(box.w * R), ch = Math.ceil(box.h * R);
      var cell = document.createElement('div'); cell.className = 'cell' + (painter ? '' : ' pending');
      var cv = document.createElement('canvas'); cv.width = cw * dpr; cv.height = ch * dpr;
      cv.style.width = cw + 'px';
      var ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      // shadow ellipse under the glass
      ctx.fillStyle = 'rgba(60,40,10,0.25)';
      ctx.beginPath(); ctx.ellipse(box.ax * R, (box.ay + 0.45) * R, 1.0 * R, 0.36 * R, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(box.ax * R, box.ay * R);                 // anchor (collider centre) in pixels
      if (painter) {
        try {
          G.applyAnchor(ctx, R);                             // R-units, base at +0.45
          painter.paint(ctx, h, {});
        } catch (e) {
          ctx.restore(); ctx.save();
          ctx.fillStyle = '#b00'; ctx.font = '12px sans-serif'; ctx.fillText('paint error: ' + e.message, -box.ax * R + 6, 16);
          console.error('tier ' + t.id, e);
        }
      } else {
        ctx.scale(R, R);
        ctx.fillStyle = t.color; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.arc(0, 0, 0.9, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = '#3a2a12'; ctx.font = '0.28px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('painting…', 0, 0.1);
      }
      ctx.restore();
      cell.appendChild(cv);
      var n = document.createElement('div'); n.className = 'name'; n.textContent = t.id + '. ' + t.name; cell.appendChild(n);
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = 'R ' + t.radius + ' u · ' + t.color + (t.accent ? ' + ' + t.accent : '') + (t.points ? ' · ' + t.points + ' pts' : '');
      cell.appendChild(m);
      grid.appendChild(cell);
    });
  }
  document.getElementById('size').addEventListener('input', draw);
})();
</script>
<script src="src-watch.js" data-auto="1"></script>
</body>
</html>
