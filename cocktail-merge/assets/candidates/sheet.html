<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Background candidates</title>
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#2a2622;--mute:#6b6259;--line:#e2d9cc;--ok:#1f7a4d;--warn:#a5520c;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,sans-serif;padding:24px}
h1{margin:0 0 4px;font-size:24px}p.sub{margin:0 0 20px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:start}
.phone{width:180px;height:320px;border-radius:14px;overflow:hidden;border:3px solid #222;background:#cfe8f5;position:relative}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.phone .table{position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(90deg,#9a6533 0 28px,#8a5a2c 28px 30px);opacity:.55;border-top:4px solid #6b4220}
.full{width:100%;max-height:150px;object-fit:contain;background:#e9eef2;border-radius:6px;display:block;margin-bottom:8px}
.num{font-weight:700;font-size:18px}.t{font-weight:600;margin:2px 0 4px}
.meta{color:var(--mute);font-size:12px;margin:2px 0}
.lic{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:4px;color:#fff}
.lic.ok{background:var(--ok)}.lic.attr{background:#2f5fa8}.lic.px{background:var(--warn)}
.flag{color:var(--bad);font-weight:600;font-size:12px;margin-top:4px}
.ov{background:linear-gradient(#7fd3f5,#bdeeff)}
</style></head><body>
<h1>Background candidates: cocktail merge game</h1>
