<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio check</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #FFF6E4; color: #3A2410; margin: 16px; }
  .fail { color: #B00020; } .pass { color: #0F6A48; }
  button { font-size: 16px; padding: 8px 14px; margin: 4px; }
</style>
</head>
<body>
<h1>Audio check</h1>
<p>Renders every recipe through an OfflineAudioContext and checks that it is audible, bounded and
shaped as intended. Tap a button to listen (needs a real browser with sound).</p>
<div id="buttons"></div>
<pre id="out">running...</pre>
<script src="../../src/dedication.js"></script>
<script src="../../src/config.js"></script>
<script src="../../src/audio/engine.js"></script>
<script src="../../src/audio/sounds.js"></script>
<script src="../../src/audio/music.js"></script>
<script>
(function () {
  'use strict';
  var RATE = 44100, OCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  var A = CM.audio, results = [], failures = [];

  function check(name, ok, info) {
    results.push({ name: name, ok: !!ok, info: info || '' });
    if (!ok) failures.push(name + (info ? ' (' + info + ')' : ''));
  }

  function stats(buf, from, to) {
    var d = buf.getChannelData(0), e = buf.numberOfChannels > 1 ? buf.getChannelData(1) : d;
    var a = Math.floor((from || 0) * RATE), b = Math.min(d.length, Math.floor((to === undefined ? 1e9 : to) * RATE));
    var peak = 0, sum = 0, zc = 0, prev = 0;
    for (var i = a; i < b; i++) {
      var s = (d[i] + e[i]) / 2, m = Math.max(Math.abs(d[i]), Math.abs(e[i]));
      if (m > peak) peak = m;
      sum += s * s;
      if ((s >= 0) !== (prev >= 0)) zc++;
      prev = s;
    }
    var n = Math.max(1, b - a);
    return { peak: peak, rms: Math.sqrt(sum / n), zcr: zc / n * RATE / 2 };
  }

  // render(seconds, fn) -> Promise<AudioBuffer>: fn runs with the engine attached to a fresh offline ctx.
  function render(seconds, fn) {
    var oc = new OCtx(2, Math.ceil(seconds * RATE), RATE);
    A.setMuted(!!fn.muted);                 // the graph is built with the current mute state
    A._attachContext(oc);
    fn(oc);
    A._sfx.flushClinks();
    return oc.startRendering();
  }

  var keep = {};
  function mutedMerge() { A._sfx.merge(4, 1, 50); }
  mutedMerge.muted = true;
  function job(name, seconds, fn, assert) {
    return function () {
      return render(seconds, fn).then(function (buf) {
        keep[name] = buf;
        assert(buf, stats(buf));
      });
    };
  }

  var jobs = [
    job('merge T2 d1', 1.5, function () { A._sfx.merge(2, 1, 50); }, function (b, s) {
      check('merge T2 audible', s.peak > 0.05, 'peak ' + s.peak.toFixed(3));
      check('merge T2 bounded', s.peak < 0.95, 'peak ' + s.peak.toFixed(3));
      var head = stats(b, 0, 0.15), tail = stats(b, 0.9, 1.2);
      check('merge T2 decays', tail.rms < head.rms * 0.15, head.rms.toFixed(4) + ' -> ' + tail.rms.toFixed(4));
    }),
    job('merge T9 d1', 2, function () { A._sfx.merge(9, 1, 50); }, function (b, s) {
      check('merge T9 audible', s.peak > 0.05, 'peak ' + s.peak.toFixed(3));
      var mid = stats(b, 0.5, 0.7);
      check('merge T9 rings past 0.5 s', mid.rms > 0.002, 'rms ' + mid.rms.toFixed(4));
    }),
    job('merge T5 d3', 1.5, function () { A._sfx.merge(5, 3, 20); }, function (b, s) {
      check('merge T5 d3 audible', s.peak > 0.05, 'peak ' + s.peak.toFixed(3));
    }),
    job('clink', 0.4, function () { A._sfx.clink(120, 8, 30, 0.25); }, function (b, s) {
      check('clink audible', s.peak > 0.02, 'peak ' + s.peak.toFixed(3));
      check('clink short (silent after 150 ms)', stats(b, 0.15, 0.4).rms < 0.004, 'rms ' + stats(b, 0.15, 0.4).rms.toFixed(4));
    }),
    job('thock', 0.4, function () { A._sfx.thock(120, 80, 0.2); }, function (b, s) { check('thock audible', s.peak > 0.02); }),
    job('whoosh', 0.5, function () { A._sfx.whoosh(50); }, function (b, s) { check('whoosh audible', s.peak > 0.01); }),
    job('coin', 0.6, function () { A._sfx.coin(0); }, function (b, s) { check('coin audible', s.peak > 0.01); }),
    job('discovery', 0.8, function () { A._sfx.discovery(); }, function (b, s) { check('discovery audible', s.peak > 0.01); }),
    job('dangerTick', 0.3, function () { A._sfx.dangerTick(3); }, function (b, s) { check('danger tick audible', s.peak > 0.01); }),
    job('win', 2.6, function () { A._sfx.win(); }, function (b, s) {
      check('win audible', s.peak > 0.05, 'peak ' + s.peak.toFixed(3));
      check('win bounded', s.peak < 0.98, 'peak ' + s.peak.toFixed(3));
      check('win still sounding at 1.5 s', stats(b, 1.4, 1.6).rms > 0.002);
    }),
    job('lose', 2.4, function () { A._sfx.lose(); }, function (b, s) {
      check('lose audible', s.peak > 0.05, 'peak ' + s.peak.toFixed(3));
      check('lose has the last glass at 1.3 s', stats(b, 1.2, 1.5).rms > 0.002);
    }),
    job('fiesta', 2, function () { A._sfx.fiesta(50); }, function (b, s) { check('fiesta audible', s.peak > 0.05); }),
    job('click', 0.2, function () { A.click(); }, function (b, s) { check('ui click audible', s.peak > 0.01); }),
    job('notReady', 0.2, function () { A.notReady(); }, function (b, s) { check('not-ready audible', s.peak > 0.005); }),
    job('consume', 2, function () {
      A.consume([
        { type: 'launch', id: 1, tier: 2, x: 40 },
        { type: 'impact', a: 1, b: 2, wall: -1, x: 40, y: 30, vn: 90, tierA: 2, tierB: 2, growing: false },
        { type: 'impact', a: 3, b: null, wall: 0, x: 2, y: 30, vn: 60, tierA: 1, tierB: 0, growing: false },
        { type: 'impact', a: 4, b: 5, wall: -1, x: 40, y: 30, vn: 90, tierA: 2, tierB: 2, growing: true },
        { type: 'merge', a: 1, b: 2, id: 6, tier: 6, x: 40, y: 30, ax: 38, ay: 30, bx: 42, by: 30, depth: 2, points: 150 },
        { type: 'discover', tier: 6 }, { type: 'dangerTick', n: 2 }, { type: 'danger', level: 1 },
        { type: 'next', current: 1, next: 2 }, { type: 'launchBlocked', blockerId: 3 }
      ], null);
    }, function (b, s) { check('consume(events) audible and bounded', s.peak > 0.05 && s.peak < 0.98, 'peak ' + s.peak.toFixed(3)); }),
    job('muted merge', 1, mutedMerge, function (b, s) {
      A.setMuted(false);
      check('mute silences', s.peak < 0.001, 'peak ' + s.peak.toFixed(4));
      check('isMuted() reports the flag', A.isMuted() === false);
    }),
    job('music', 14, function () { A.music._render(0.05, 13.5); }, function (b, s) {
      check('music audible', s.rms > 0.003, 'rms ' + s.rms.toFixed(4));
      check('music quiet (peak < 0.2)', s.peak < 0.2, 'peak ' + s.peak.toFixed(3));
      var gaps = 0;
      for (var t = 1; t < 13; t += 0.5) if (stats(b, t, t + 0.5).rms < 0.0015) gaps++;
      check('music has no silent gaps', gaps === 0, gaps + ' silent half-seconds');
    }),
    function () {
      // A merge must stand clearly above the music bed.
      var m = stats(keep['music'], 1, 13).rms, g = stats(keep['merge T5 d3'], 0, 0.3).rms;
      check('merge louder than music', g > m * 2.5, g.toFixed(4) + ' vs ' + m.toFixed(4));
      check('T9 rings lower than T2', stats(keep['merge T9 d1'], 0.05, 0.6).zcr < stats(keep['merge T2 d1'], 0.05, 0.6).zcr,
        stats(keep['merge T9 d1'], 0.05, 0.6).zcr.toFixed(0) + ' Hz vs ' + stats(keep['merge T2 d1'], 0.05, 0.6).zcr.toFixed(0) + ' Hz');
      return Promise.resolve();
    }
  ];

  function api() {
    ['init', 'unlockFromGesture', 'unlock', 'setMuted', 'isMuted', 'muted', 'setAmbience', 'ambience',
     'consume', 'click', 'notReady', 'glassFreq'].forEach(function (k) {
      check('CM.audio.' + k + ' is a function', typeof A[k] === 'function');
    });
    ['start', 'stop', 'setEnabled', 'enabled', 'duck'].forEach(function (k) {
      check('CM.audio.music.' + k + ' is a function', A.music && typeof A.music[k] === 'function');
    });
    check('glassFreq falls with tier', A.glassFreq(9, 1) < A.glassFreq(2, 1));
    check('glassFreq rises with chain depth', A.glassFreq(5, 3) > A.glassFreq(5, 1));
    check('music level <= 0.12', A.music.LEVEL <= 0.12);
    // No context before a gesture: every entry point is a silent no-op.
    A.init({ muted: false, ambience: true, music: true });
    A.consume([{ type: 'merge', tier: 3, depth: 1, x: 50 }], null);
    A.click(); A.music.start(); A.ambience(true);
    check('no AudioContext before a gesture', A.state() === 'none', A.state());
    A.music.stop(); A.ambience(false);      // keep the offline renders free of the wave noise
  }

  function finish() {
    var out = results.map(function (r) { return (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.info ? '  [' + r.info + ']' : ''); });
    var el = document.getElementById('out');
    el.textContent = (failures.length ? failures.length + ' FAILED\n' : 'ALL PASSED\n') + out.join('\n');
    el.className = failures.length ? 'fail' : 'pass';
    window.__audioCheck = { done: true, ok: failures.length === 0, failures: failures, results: results };
    window.__audioBuffers = keep;
  }

  // ?live: the real unlock path. init() + music.start() before any gesture; the runner then clicks.
  if (/[?&]live\b/.test(location.search)) {
    A.init({ muted: false, ambience: true, music: true });
    A.ambience(true);
    A.music.start();
    window.__live = function () {
      return { state: A.state(), music: A.music.playing(), muted: A.isMuted() };
    };
    document.getElementById('out').textContent = 'live mode: tap anywhere';
    return;
  }

  try {
    if (!OCtx) throw new Error('no OfflineAudioContext');
    api();
    jobs.reduce(function (p, j) { return p.then(j); }, Promise.resolve()).then(finish, function (e) {
      check('render', false, String(e && e.stack || e)); finish();
    });
  } catch (e) { check('setup', false, String(e && e.stack || e)); finish(); }

  // Listening buttons (real browsers): the first tap unlocks the live context.
  var names = ['merge 2', 'merge 5', 'merge 9', 'chain 4', 'clink', 'win', 'lose', 'fiesta', 'music on', 'music off'];
  names.forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', function () {
      if (A.state() === 'none' || window.__offlineUsed !== false) {
        var C = window.AudioContext || window.webkitAudioContext;
        A._attachContext(new C()); window.__offlineUsed = false;
      }
      var p = n.split(' ');
      if (p[0] === 'merge') A._sfx.merge(+p[1], 1, 50);
      else if (p[0] === 'chain') A._sfx.merge(6, +p[1], 50);
      else if (n === 'clink') A._sfx.clink(130, 9, 50, 0.3);
      else if (n === 'music on') A.music.start();
      else if (n === 'music off') A.music.stop();
      else A._sfx[n](50);
    });
    document.getElementById('buttons').appendChild(b);
  });
})();
</script>
</body>
</html>
