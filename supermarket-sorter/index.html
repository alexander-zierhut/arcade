<body>
<!-- the arcade kit (shared/, see docs/GAME-SPEC.md): loading screen, language, app mode, home, performance mode, news, share, backup -->
<script src="shared/core.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/app.js"></script>
<script src="shared/perf.js"></script>
<script src="shared/stats.js"></script>
<script src="shared/campaigns.js"></script>
<script src="shared/news.js"></script>
<script src="shared/share.js"></script>
<script src="shared/backup.js"></script>
<script src="shared/menu.js"></script>
<script src="shared/hooks.js"></script>
<script src="news.js"></script>
<script>Arcade.init({ game: 'supermarket-sorter', title: 'Supermarket Sorter', version: '0.3.4' });</script>
<div id="app" class="app">
  <div id="hud" class="hud" hidden>
    <div class="hud-row">
      <div id="hud-level" class="pill pill-level"><span id="hud-level-text">Lv. 1</span><span id="hud-left" class="pill-sub">Noch 0</span></div>
      <div id="hud-mid" class="pill pill-mid">
        <span class="pill-line"><span id="hud-mid-icon" class="pill-icon"></span><span id="hud-mid-text">00:00</span></span>
        <span id="hud-score" class="pill-sub"><span class="star-ic"></span><span id="hud-score-text">0</span><span id="hud-combo-x" class="combo-x">x1</span></span>
      </div>
      <button id="btn-undo" class="act" type="button" aria-label="Rückgängig"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">Rückgängig</span></button>
      <button id="btn-hint" class="act" type="button" aria-label="Tipp" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.8.6 1.5 1.6 1.5 2.6h4c0-1 .7-2 1.5-2.6A6 6 0 0 0 12 3z"/></svg><span class="lbl">Tipp</span></button>
      <button id="btn-bunny" class="act act-bunny" type="button" aria-label="Goldhase"><span class="ic-bunny"></span><span class="lbl">Goldhase</span><span id="bunny-count" class="count">0</span></button>
      <button id="btn-pause" class="pause-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
    <div id="hud-combo" class="combo-bar" hidden aria-hidden="true"><div id="hud-combo-fill" class="fill"></div></div>
  </div>

  <div id="board" class="board" hidden>
    <div id="shelf" class="shelf"></div>
    <div id="items" class="items"></div>
    <div id="locks" class="locks"></div>
    <div id="fx" class="fx" aria-hidden="true"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="overlays" class="overlays">
    <section id="ov-title" class="ov ov-title" hidden inert aria-label="Titel">
      <div class="title-col">
        <div class="logo">
          <div class="logo-cart" aria-hidden="true"></div>
          <h1 id="logo-title" class="logo-title">Supermarket Sorter</h1>
          <p id="logo-sub" class="logo-sub">Stock the shelves, match three</p>
        </div>
        <div class="btn-col">
          <button class="btn btn-primary" type="button" data-act="play-relaxed">Entspannt spielen<small>ohne Zeitdruck</small></button>
          <button class="btn btn-secondary" type="button" data-act="play-timed">Gegen die Zeit<small>mit Timer und laufenden Regalen</small></button>
        </div>
        <p id="title-stats" class="stats"></p>
        <div class="chip-row">
          <button class="chip" type="button" data-act="howto">Anleitung</button>
          <button class="chip" type="button" data-act="scores">Bestenliste</button>
          <button class="chip" type="button" data-act="settings">Einstellungen</button>
          <button class="chip chip-new" type="button" data-act="whatsnew">Neuigkeiten<span class="new-badge" hidden>NEU</span></button>
          <button class="chip" type="button" data-arcade="home">Alle Spiele</button>
        </div>
      </div>
    </section>

    <section id="ov-intro" class="ov ov-modal ov-intro" hidden inert aria-label="Level">
      <div class="card card-intro" data-act="intro-go">
        <h2 class="card-title js-title">Level 1</h2>
        <div class="intro-tag js-tag" hidden>Schwer</div>
        <p class="card-line js-line"></p>
        <p class="card-line js-sub"></p>
        <button class="btn btn-primary" type="button" data-act="intro-go">Los geht's</button>
      </div>
    </section>

    <section id="ov-pause" class="ov ov-modal" hidden inert aria-label="Pause">
      <div class="card scroll">
        <h2 class="card-title">Pause</h2>
        <p class="card-line js-score"></p>
        <div class="btn-col">
          <button class="btn btn-primary" type="button" data-act="resume">Weiter</button>
          <button class="btn btn-secondary" type="button" data-act="restart" data-arm="Nochmal tippen: Level neu starten">Level neu starten</button>
          <button class="btn btn-secondary" type="button" data-act="howto">Anleitung</button>
          <button class="btn btn-secondary" type="button" data-act="quit">Zum Menü</button>
        </div>
        <div class="settings js-settings"></div>
      </div>
    </section>

    <section id="ov-win" class="ov ov-modal" hidden inert aria-label="Level geschafft">
      <div class="card card-win scroll">
        <div class="ribbon ribbon-green"><h2 class="card-title js-title">Level geschafft!</h2></div>
        <div class="stars js-stars" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="card-line card-score js-score"></p>
        <p class="card-line js-detail"></p>
        <p class="card-line js-extra"></p>
        <div class="newbest-ribbon js-newbest" hidden>Neuer Rekord!</div>
        <div class="btn-col">
          <button class="btn btn-primary" type="button" data-act="next">Nächstes Level</button>
          <button class="btn btn-secondary" type="button" data-act="share">Teilen</button>
          <button class="btn btn-secondary" type="button" data-act="quit">Zum Menü</button>
        </div>
      </div>
    </section>

    <section id="ov-timeout" class="ov ov-modal" hidden inert aria-label="Zeit abgelaufen">
      <div class="card scroll">
        <h2 class="card-title js-title">Zeit abgelaufen</h2>
        <p class="card-line js-text"></p>
        <div class="btn-col">
          <button class="btn btn-primary" type="button" data-act="extend">+30 Sekunden</button>
          <button class="btn btn-secondary" type="button" data-act="end-serie" data-arm="Nochmal tippen: Serie beenden">Serie beenden</button>
        </div>
      </div>
    </section>

    <section id="ov-serie" class="ov ov-modal" hidden inert aria-label="Serie gespeichert">
      <div class="card scroll">
        <h2 class="card-title js-title">Serie gespeichert</h2>
        <p class="card-line card-score js-score"></p>
        <p class="card-line js-detail"></p>
        <div class="newbest-ribbon js-newbest" hidden>Neuer Rekord!</div>
        <div class="btn-col">
          <button class="btn btn-primary" type="button" data-act="retry">Weiter</button>
          <button class="btn btn-secondary" type="button" data-act="share">Teilen</button>
          <button class="btn btn-secondary" type="button" data-act="quit">Zum Menü</button>
        </div>
      </div>
    </section>

    <section id="ov-stuck" class="ov ov-sheet" hidden inert aria-label="Kein Platz mehr">
      <div class="card scroll">
        <h2 class="card-title js-title">Kein Platz mehr</h2>
        <p class="card-line js-text"></p>
        <div class="btn-col">
          <button class="btn btn-primary" type="button" data-act="undo">Rückgängig</button>
          <button class="btn btn-secondary js-bunny" type="button" data-act="rescue">Rettungshase</button>
          <button class="btn btn-secondary" type="button" data-act="restart" data-arm="Nochmal tippen: Level neu starten">Level neu starten</button>
        </div>
      </div>
    </section>

    <section id="ov-howto" class="ov ov-modal" hidden inert aria-label="Anleitung">
      <div class="card scroll">
        <h2 class="card-title">Anleitung</h2>
        <div class="howto js-howto"></div>
        <div class="btn-col"><button class="btn btn-primary" type="button" data-act="close">Alles klar</button></div>
      </div>
    </section>

    <section id="ov-scores" class="ov ov-modal" hidden inert aria-label="Bestenliste">
      <div class="card scroll">
        <h2 class="card-title">Bestenliste</h2>
        <div class="tabs"><button class="tab on" type="button" data-tab="relaxed">Entspannt</button><button class="tab" type="button" data-tab="timed">Gegen die Zeit</button></div>
        <div class="scores js-scores"></div>
        <div class="btn-col"><button class="btn btn-primary" type="button" data-act="close">Zurück</button></div>
      </div>
    </section>

    <section id="ov-whatsnew" class="ov ov-modal" hidden inert aria-label="Neuigkeiten">
      <div class="card scroll">
        <div class="ribbon ribbon-green"><h2 class="card-title js-title">Neu in Version 0.3.4</h2></div>
        <div class="howto js-text"></div>
        <div class="btn-col"><button class="btn btn-primary" type="button" data-act="close">Alles klar</button></div>
      </div>
    </section>

    <section id="ov-settings" class="ov ov-modal" hidden inert aria-label="Einstellungen">
      <div class="card scroll">
        <h2 class="card-title">Einstellungen</h2>
        <div class="settings js-settings"></div>
        <p class="card-note js-version"></p>
        <div class="btn-col"><button class="btn btn-primary" type="button" data-act="close">Zurück</button></div>
      </div>
    </section>
  </div>
</div>

<script src="src/config.js"></script>
<script src="src/game/rng.js"></script>
<script src="src/game/board.js"></script>
<script src="src/game/rules.js"></script>
<script src="src/game/solver.js"></script>
<script src="src/game/score.js"></script>
<script src="src/game/game.js"></script>
<script src="src/game/gen.js"></script>
<script src="src/game/levels-data.js"></script>
<script src="src/game/levels.js"></script>

<script src="src/ui/board.js"></script>
<script src="src/ui/boardfx.js"></script>
<script src="src/ui/coach.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/overlays.js"></script>

<script>
// Boot guard: if a script failed to load or threw, show a readable card instead of a blank page.
(function () {
  var SS = window.SS || {};
  var need = ['config', 'board', 'game', 'levels', 'save', 'sprites', 'strings', 'main'];
  var missing = [];
  for (var i = 0; i < need.length; i++) if (!SS[need[i]] && !(SS.ui && SS.ui[need[i]])) missing.push(need[i]);
  if (missing.length && !SS.main) {
    document.body.className = 'boot-failed';
    document.body.innerHTML = '<div class="boot-card"><h1>Das Spiel konnte nicht starten</h1><p>Eine Datei fehlt oder ist fehlerhaft. Bitte alle Dateien zusammen hochladen (index.html, src/, assets/).</p><p class="boot-missing">Fehlt: ' + missing.join(', ') + '</p></div>';
  }
})();
</script>
</body>
